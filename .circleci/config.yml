version: 2
jobs:
  build:
    branches:
      ignore:
        - gh-pages
    docker:
      - image: cimg/node:26.7.0
    steps:
      - checkout
      - run: node --version
      - run:
          name: install
          command: yarn install
      - run:
          name: build
          command: yarn run build
      - run:
          name: test
          command: yarn test
      - run:
          name: lint
          command: yarn run lint
